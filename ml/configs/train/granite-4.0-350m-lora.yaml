# #75: LoRA on Granite 4.0-350M, the dense (all-attention) sibling of 4.0-H-350M: same licence, no Mamba layers to slow the CPU
# Run (from ml/, after `uv sync --group train`):
#   uv run python scripts/train_sft.py configs/train/granite-4.0-350m-lora.yaml
name: granite-4.0-350m-lora
base: ibm-granite/granite-4.0-350m
revision: bd8a1497065c0d6ba1ef19af6b0d2b14bacf71c2
mode: lora
data: data/train/train.jsonl
format: compact # the record as the model writes it (extract.encode); must match the eval run
val_frac: 0.05
seed: 75

epochs: 3
learning_rate: 2.0e-4
scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.0
batch_size: 8
grad_accum: 2 # effective batch 16
max_length: 768 # tokens, prompt + completion; train_sft.py fails if any example is longer
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  targets: all-linear
