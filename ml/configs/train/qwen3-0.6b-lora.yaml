# #75: LoRA on Qwen3-0.6B, the recipe that won on LFM2.5-350M (lfm2.5-350m-lora)
# Run (from ml/, after `uv sync --group train`):
#   uv run python scripts/train_sft.py configs/train/qwen3-0.6b-lora.yaml
name: qwen3-0.6b-lora
base: Qwen/Qwen3-0.6B
revision: c1899de289a04d12100db370d81485cdf75e47ca
mode: lora
data: data/train/train.jsonl
format: compact # the record as the model writes it (extract.encode); must match the eval run
val_frac: 0.05
seed: 75

epochs: 3
learning_rate: 2.0e-4
scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.0
batch_size: 8
grad_accum: 2 # effective batch 16
max_length: 768 # tokens, prompt + completion; train_sft.py fails if any example is longer
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  targets: all-linear
