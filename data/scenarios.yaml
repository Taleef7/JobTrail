# Scenario matrix for eval drafts (#70). The sampler (ml/jobtrail_ml/sampler.py)
# builds each gold record from a job template below, then Gemini writes a note
# that says exactly that record. Labeling rules: data/LABELING.md.
#
# materials: qty = [min, max] when a number is said; vague: true allows "some X"
# (quantity null). unit is the word said with the quantity, or null for counts.
version: 1

styles:
  terse: >-
    Clipped fragments typed in a hurry: no filler, one to three short sentences.
  rambling: >-
    Conversational and long-winded: side comments about the house, the customer
    or the drive, but every fact is still in there.
  spoken-fillers: >-
    A raw speech-to-text transcript of someone talking: "um", "uh", "so yeah",
    false starts, loose punctuation.
  run-on: >-
    One long run-on sentence strung together with "and" and "then", barely any
    punctuation.

tags:
  hours-phrasing:
    conflicts: [extra-labor]
  negation: {}
  self-correction: {}
  multiple-materials:
    conflicts: [no-materials]
  no-materials:
    conflicts: [multiple-materials, supply-house-trip]
  supply-house-trip:
    conflicts: [no-materials]
  extra-labor:
    conflicts: [hours-phrasing]
  approval-absent: {}

# How often the untagged parts of a record vary.
mix:
  plain_share: 0.2 # notes with no hard-case tag
  two_tags_share: 0.5 # of tagged notes, share with two tags
  labor_missing: 0.08 # labor not mentioned (only on notes without labor tags)
  issue: 0.5 # chance of one issue found
  followup: 0.4 # chance of one follow-up
  second_work: 0.35 # chance of a second work item from the template
  vague_quantity: 0.3 # for vague materials, chance the number is not said

hours_values: [30, 45, 60, 90, 120, 150, 180, 240]
extra_labor_minutes: [15, 20, 25, 30, 40, 45]

