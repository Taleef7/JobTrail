version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      expo-runtime:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
      react:
        patterns:
          - "react"
          - "react-native"
          - "react-dom"
      firebase:
        patterns:
          - "firebase"
          - "@firebase/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
          - "ts-*"
      dev-tools:
        patterns:
          - "eslint"
          - "jest"
          - "ts-jest"
          - "@typescript-eslint/*"

  - package-ecosystem: "github-actions"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
