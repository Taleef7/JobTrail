# v2: only GitHub Actions until the monorepo lands (#63), which adds
# the pnpm workspaces and the uv project here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
