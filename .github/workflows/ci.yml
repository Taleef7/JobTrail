name: CI

# Minimal docs-only CI while the repo is reset (#62).
# The monorepo CI (core, ml, web, mobile) replaces this in #63.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No workflow or config references removed legacy paths
        run: |
          if grep -rn --exclude=ci.yml "apps/mobile" .github; then
            echo "::error::.github still references the removed legacy app"
            exit 1
          fi
      - name: Relative markdown links resolve
        run: |
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#]+' "$file" | sed 's/^](//' | grep -vE '^(https?:|mailto:)' | while IFS= read -r link; do
              if [ ! -e "$dir/$link" ]; then
                echo "::error file=$file::broken link: $link"
                echo broken >> /tmp/broken
              fi
            done
          done < <(git ls-files '*.md')
          [ ! -f /tmp/broken ] || status=1
          exit $status
