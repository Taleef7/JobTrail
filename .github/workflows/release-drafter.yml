name: Release Drafter
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          tag-format: "v$RESOLVED_VERSION"
          version-resolver:
            major:
              labels: ["breaking", "major"]
            minor:
              labels: ["feature", "enhancement", "phase:*"]
            patch:
              labels: ["bug", "fix", "chore", "docs", "dependencies", "ci"]
            default: patch
          categories:
            - title: "🚀 Features"
              labels: ["feature", "enhancement"]
            - title: "🐛 Bug Fixes"
              labels: ["bug", "fix"]
            - title: "🧰 Maintenance"
              labels: ["chore", "refactor", "ci", "dependencies"]
            - title: "📚 Documentation"
              labels: ["docs", "documentation"]
            - title: "🧪 Tests"
              labels: ["test", "tests"]
          exclude-labels: ["skip-changelog"]
          template: |
            ## Changes

            $CHANGES

            **Full Changelog**: https://github.com/Taleef7/JobTrail/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

            _This draft was auto-generated by [release-drafter](https://github.com/release-drafter/release-drafter)._
