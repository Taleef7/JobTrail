name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        default: preview
        options:
          - development
          - preview
          - production
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android
  push:
    tags:
      - "v*"

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build (${{ inputs.profile || 'production' }} / ${{ inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ vars.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run EAS Build
        working-directory: apps/mobile
        env:
          EAS_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
          EAS_BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
        run: eas build --non-interactive --platform "${EAS_BUILD_PLATFORM}" --profile "${EAS_BUILD_PROFILE}"
