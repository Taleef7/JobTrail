name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        default: preview
        options:
          - development
          - preview
          - production
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/mobile/eas.json"
      - ".github/workflows/eas-build.yml"

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build (${{ inputs.profile || 'tag' }} / ${{ inputs.platform || 'tag' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ vars.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Determine profile
        id: profile
        run: |
          if [ -n "${{ inputs.profile }}" ]; then
            echo "name=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine platform
        id: platform
        run: |
          if [ -n "${{ inputs.platform }}" ]; then
            echo "name=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EAS Build
        working-directory: apps/mobile
        run: eas build --non-interactive --platform ${{ steps.platform.outputs.name }} --profile ${{ steps.profile.outputs.name }}

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.profile.outputs.name == 'preview'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eas-preview-build
          message: |
            ✅ EAS preview build triggered.

            See the latest build in the [Expo dashboard](https://expo.dev/accounts/${{ github.repository_owner }}/projects/jobtrail/builds).
