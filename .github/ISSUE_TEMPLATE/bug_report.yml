name: Bug report
description: Report a bug or unexpected behavior in JobTrail
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the template below so we can reproduce and fix it.

  - type: input
    id: app-version
    attributes:
      label: App / commit version
      description: "e.g. v0.1.0, commit SHA, or branch name"
      placeholder: main @ <commit-sha>
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the bug happen?
      options:
        - Android — release APK (Redmi Note 9S)
        - Android — release APK (other device)
        - Android — dev build
        - iOS — dev build (iPhone 16 Pro)
        - Web — live site
        - Web — local dev
        - ML pipeline / eval
        - CI
        - Other / not sure
      default: 0
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. The more specific, the better.
      placeholder: |
        1. Open the app (build / commit: ...)
        2. Record note: "..."
        3. Tap "Review"...
      value: ""
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      value: ""
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages, screenshots, or logs.
      value: ""
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste device / console / CI logs, or attach a screenshot or screen recording.
      value: ""

  - type: checkboxes
    id: checks
    attributes:
      label: Self-checks
      options:
        - label: I searched existing issues to make sure this isn't a duplicate
        - label: I have not committed any `.env`, secrets, or API keys
