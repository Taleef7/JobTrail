name: Bug report
description: Report a bug or unexpected behavior in JobTrail
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the template below so we can reproduce and fix it.

  - type: input
    id: app-version
    attributes:
      label: App / commit version
      description: "e.g. v0.1.0, commit SHA, or branch name"
      placeholder: main @ <commit-sha>
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the bug happen?
      options:
        - iOS (Expo Go)
        - iOS (Dev Client / EAS Build)
        - Android (Expo Go)
        - Android (Dev Client / EAS Build)
        - Web
        - CI
        - Other / not sure
      default: 0
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. The more specific, the better.
      placeholder: |
        1. Open the app
        2. Create a job titled "..."
        3. Tap "Add note"...
      value: ""
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      value: ""
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages, screenshots, or logs.
      value: ""
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste Metro / device / CI logs, or attach a screenshot.
      value: ""

  - type: checkboxes
    id: checks
    attributes:
      label: Self-checks
      options:
        - label: I searched existing issues to make sure this isn't a duplicate
        - label: I have not committed any `.env`, secrets, or API keys
