name: Feature request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. See the [design doc](https://github.com/Taleef7/JobTrail/blob/main/docs/superpowers/specs/2026-09-28-jobtrail-rebuild-design.md) for scope and non-goals.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What pain does this address for a solo tradesperson (or for the ML evidence)?"
      placeholder: |
        As a <user type>, I want to <do X>, so I can <achieve Y>.
      value: ""
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: How should this work? Sketch the user flow.
      value: ""
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "What other approaches did you consider? Why is the proposed one better?"
      value: ""

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - M0 Reset & de-risk
        - M1 Eval foundation
        - M2 Model
        - M3 Mobile MVP
        - M4 Web demo & evidence
        - M5 Launch
        - Post-launch / future
      default: 6

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (observable)
      description: What will be visible in the live web app or release APK when this is done?
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, related apps, prior art, etc.
      value: ""

  - type: checkboxes
    id: checks
    attributes:
      label: Self-checks
      options:
        - label: I searched existing issues / feature requests
        - label: It fits the v2 non-goals (no accounts, no cloud sync, nothing leaves the device unless the user shares it)
